services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      N8N_HOST: 127.0.0.1
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://127.0.0.1:5678/
    volumes:
      - n8n_data:/home/src_yankee/.n8n
    # Ollama and LTX Watch stay on the host. n8n is an optional visual planner.
    # It must not be given the Watch control token.

volumes:
  n8n_data:
